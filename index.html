<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Formulario</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <headder>
        <section id="headder-section">
            <h1>Oficina Codeverse</h1>
            <p>Inscreva-se para participar da próxima missão.</p>
        </section>
    </headder>

    <main>
        <section id="inscricao">
            <h2>Faça sua inscrição e um formulário</h2>
            <article>
                <form action="#" method="get">
                    <label for="heroi">Nome do Herói:</label>
                    <input id="heroi" name="heroi" type="text" />
                </form>
            </article>

            <article>
                <form action="#" method="get">
                    <label for="email">E-mail:</label>
                    <input id="email" name="email" type="text" />
                </form>
            </article>

            <article>
                <form action="#" method="get">
                    <label for="idade">Idade:</label>
                    <input id="idade" name="idade" type="text" />
                </form>
            </article>

            <article>
                <form action="#" method="get">
                    <label for="equipe">Escolha sua equipe:</label>
                    <select id="equipe" name="equipe">
                    <option>Liga da Justiça</option>
                    <option>X-man</option>
                    <option>Vingadores</option>
                </select>
                </form>  
            </article>

            <h2>Qual poder você prefere?</h2>

            <article class="opcao">
                <input id="poder" name="poder" type="radio" />
                <label for="poder">Voar</label>
            </article>

            <article class="opcao">
                <input id="poder" name="poder" type="radio" />
                <label for="poder">Supervelocidade</label>
            </article>

            <article class="opcao">
                <input id="poder" name="poder" type="radio" />
                <label for="poder">Superforça</label>
            </article>

            <article class="opcao">
                <input id="missao" name="missao" type="checkbox" />
                <label for="missao">Quero receber novas missões</label>
            </article>


            <label for="justificativa">Por que você quer ser um herói?</label>
            <textarea id="justificativa" name="justificativa" rows="4"></textarea>


            <form>
                <button type="submit">Enviar inscrição</button>
            </form>


        </section>
    </main>

    <footer>
        <p>Prática de formulários HTML</p>
    </footer>
</body>

</html>
